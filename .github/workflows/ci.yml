# Checks every push and pull request. Google AI Studio ignores this file; it
# only runs on GitHub, so edits made in AI Studio and synced back are checked too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Type check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --legacy-peer-deps: esbuild and vite declare overlapping peer ranges.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  firestore-rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/firestore-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm test
