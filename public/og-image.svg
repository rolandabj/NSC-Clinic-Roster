<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Card container -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#0F172A" fill-opacity="0.7" stroke="#4338CA" stroke-width="2" filter="url(#shadow)" />

  <!-- Logo Mark -->
  <rect x="140" y="140" width="76" height="76" rx="20" fill="url(#accent)" />
  <path d="M178 156 V200 M156 178 H200" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <circle cx="178" cy="178" r="4.5" fill="#EEF2FF" />

  <!-- Badge -->
  <rect x="236" y="156" width="168" height="36" rx="18" fill="#4338CA" fill-opacity="0.4" stroke="#6366F1" stroke-width="1.5" />
  <text x="320" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#A5B4FC" text-anchor="middle">CLINICAL SUITE</text>

  <!-- Title -->
  <text x="140" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1">ClinicRoster</text>

  <!-- Tagline -->
  <text x="140" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#818CF8">Outpatient Clinic Scheduling &amp; Roster Management</text>

  <!-- Description lines -->
  <text x="140" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#94A3B8">Deterministic nurse-to-doctor pairing, contract hours balancing, locked day enforcement,</text>
  <text x="140" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#94A3B8">and Excel-like multi-staff workbook with live validation and shift audit trails.</text>

  <!-- Feature Pills -->
  <g transform="translate(140, 460)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="85" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0" text-anchor="middle">Deterministic Engine</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="160" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="265" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0" text-anchor="middle">Doctor-Nurse Pairing</text>

    <!-- Pill 3 -->
    <rect x="360" y="0" width="160" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="440" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0" text-anchor="middle">Live Quota &amp; Audit</text>

    <!-- Pill 4 -->
    <rect x="535" y="0" width="175" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="622" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0" text-anchor="middle">Excel Workbook Sync</text>
  </g>
</svg>
