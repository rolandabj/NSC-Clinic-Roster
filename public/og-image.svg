<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- The app's look: teal brand on a light page, the CalendarRange logo, Inter. -->
  <rect width="1200" height="630" fill="#F8FAFC" />
  <rect x="0" y="0" width="1200" height="12" fill="#0E7490" />

  <g transform="translate(120 150)">
    <rect width="96" height="96" rx="20" fill="#0E7490" />
    <g transform="translate(18 18) scale(2.5)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="4" rx="2" />
      <path d="M16 2v4M3 10h18M8 2v4M17 14h-6M13 18H7M7 14h.01M17 18h.01" />
    </g>
  </g>

  <text x="120" y="330" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#0F172A" letter-spacing="-1">NSC Clinic Roster</text>
  <text x="120" y="392" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="500" fill="#155E75">Nurse rosters for an outpatient clinic</text>
  <text x="120" y="450" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#475569">Made around the doctors' clinics and the nurses' leave,</text>
  <text x="120" y="486" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#475569">checked against the clinic's rules, and sent to each nurse.</text>
</svg>
